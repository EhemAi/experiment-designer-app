name: CodeQL
on:
  push:
  pull_request:
  schedule:
    - cron: '37 6 * * 1'
permissions:
  contents: read
jobs:
  csharp:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.403'
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Build production projects for extraction
        shell: pwsh
        run: |
          dotnet build src/PoultryDesigner.Desktop/PoultryDesigner.Desktop.csproj -c Release --no-incremental --configfile NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/PoultryDesigner.Setup/PoultryDesigner.Setup.csproj -c Release --no-incremental --configfile NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:csharp
